<!--
  Supabase → Authentication → Emails → Templates → "Confirm signup"
  Subject: Your lendr code: {{ .Token }}
  The button opens lendr's /confirm page (needs Site URL = https://lendr-uci.vercel.app), where one tap confirms.
  That extra tap stops email link scanners from using up the code before the student sees it.
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; color: #0c2340">
  <h2 style="margin: 0 0 8px">Confirm your UCI email</h2>
  <p style="color: #5e7185">Enter this code on lendr to finish creating your account:</p>
  <p style="font-size: 32px; font-weight: 800; letter-spacing: 8px; margin: 16px 0; color: #0064a4">{{ .Token }}</p>
  <p style="color: #5e7185">Or tap the button, then tap “Confirm my email” on the page that opens:</p>
  <p>
    <a href="{{ .SiteURL }}/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display: inline-block; padding: 12px 20px; background: #0c2340; color: #fff; border-radius: 12px; text-decoration: none; font-weight: 700">Confirm my email</a>
  </p>
  <p style="color: #89958d; font-size: 13px">The code expires in an hour. If you didn't sign up for lendr, you can ignore this email.</p>
</div>
